<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Текст по центру</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
        }

        .typing-container {
            width: 100%;
            max-width: 700px;
            height: 70vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px 30px;
            text-align: center;
        }

        /* Кастомный скроллбар */
        .typing-container::-webkit-scrollbar {
            width: 8px;
        }
        .typing-container::-webkit-scrollbar-track {
            background: #000000;
        }
        .typing-container::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }
        .typing-container::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        .typing-text {
            color: #ffffff;
            font-size: 30px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        @media (max-width: 700px) {
            .typing-text {
                font-size: 20px;
            }
            .typing-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="typing-container">
        <!-- ============================================ -->
        <!-- ✏️ ЗДЕСЬ МЕНЯЙ ТЕКСТ (между тегами <div>) -->
        <!-- ============================================ -->
        <div class="typing-text">Привет, дорогой друг!

Это мой текст, который ровно по центру экрана.

Здесь можно написать всё, что угодно: историю, признание, стихотворение или просто мысли.

Если текста станет много — справа появится скроллбар, и можно будет прокрутить вниз.</div>
        <!-- ============================================ -->
    </div>

</body>
</html>
